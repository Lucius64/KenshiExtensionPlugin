name: Crash Report
description: File a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    attributes:
      label: Platform
      placeholder: "Windows"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: "Steps to reproduce the behavior."
  - type: upload
    id: crash-dump
    attributes:
      label: Upload crash dump
      description: "Please attach the crashDump1.0.65_x64.zip or kenshi_GOG_x64.zip file generated by RE_Kenshi."
    validations:
      required: true
      accept: ".zip"
  - type: upload
    id: log
    attributes:
      label: Upload RE_Kenshi log
      description: "Please attach the RE_Kenshi log (RE_Kenshi_log.txt)."
    validations:
      accept: ".txt"
